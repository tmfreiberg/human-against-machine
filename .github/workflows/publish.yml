name: Publish book

on:
  push:
    branches: [main]
    paths:
      - "_quarto.yml"
      - "index.qmd"
      - "book/**"
      - "notebooks/**"
      - "_freeze/**"
      - "demo/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.39

      # The notebooks need the 10,015-image dataset and a trained checkpoint,
      # neither of which is in the repository. `execute: freeze: auto` means
      # Quarto renders from the results stored in _freeze/, committed by
      # whoever last rendered locally. Nothing is executed here.
      - name: Render
        run: quarto render --no-execute

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
