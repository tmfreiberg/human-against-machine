# Balanced, random crop plus colour jitter.
#
# Note that this differs from 04 only in the added ColorJitter step. Under a
# naming scheme built from a few flags plus a hand-written suffix the two would
# be easy to confuse; under the config hash they are separate by construction.
name: Balanced with crop and jitter
description: >
  Adds colour jitter on top of random cropping. Dermatoscopic images vary in
  illumination and white balance across the source clinics, so jitter targets a
  real source of nuisance variation rather than an imagined one.

classes: [mel, nv, bkl, bcc, akiec, vasc, df]
split: {train_val_ratio: 3, seed: 0, keep_first: false, stratified: true}

architecture: resnet18
freeze_strategy: last_block
n_blocks: 1
training: {epochs: 10, batch_size: 32, learning_rate: 0.0001}

train_one_image_per_lesion: false
validation_expansion: 3
balance: {mel: 1000, nv: 1000, bkl: 1000, bcc: 1000, akiec: 1000, vasc: 1000, df: 1000}

transform:
  - {name: RandomCrop, size: [300, 300]}
  - {name: ColorJitter, brightness: 0.4, contrast: 0.4, saturation: 0.4, hue: 0.1}
  - {name: Resize, size: [224, 224]}
  - {name: ToTensor}
  - {name: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}