# The binary task: melanoma against nevus, everything else grouped as `other`.
name: Binary melanoma vs nevus
description: >
  Two named classes with the remaining five diagnoses collapsed into `other`.
  This is the task the Streamlit demo presents to a human.

classes:
  mel: [mel]
  nv: [nv]

split: {train_val_ratio: 3, seed: 0, keep_first: false, stratified: true}

architecture: resnet18
freeze_strategy: all
training: {epochs: 10, batch_size: 32, learning_rate: 0.01}
train_one_image_per_lesion: true

transform:
  - {name: Resize, size: [224, 224]}
  - {name: ToTensor}
  - {name: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}