# Balanced training set, one image per lesion, no augmentation.
name: Balanced, no augmentation
description: >
  Isolates the effect of class balancing. Nevi are undersampled and the rare
  classes oversampled to 2000 images each, drawn lesion-wise so that a lesion
  photographed five times does not gain five times the influence.

classes: [mel, nv, bkl, bcc, akiec, vasc, df]
split: {train_val_ratio: 3, seed: 0, keep_first: false, stratified: true}

architecture: resnet18
freeze_strategy: last_block
n_blocks: 1
training: {epochs: 10, batch_size: 32, learning_rate: 0.0001}

train_one_image_per_lesion: true
balance: {mel: 1000, nv: 1000, bkl: 1000, bcc: 1000, akiec: 1000, vasc: 1000, df: 1000}

transform:
  - {name: Resize, size: [224, 224]}
  - {name: ToTensor}
  - {name: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}

# Target note: 1,000 per class. At 2,000, dermatofibroma's 54 training lesions
# would be repeated 24 times per epoch, which risks memorising 54 lesions rather
# than learning the class. 1,000 halves the extreme factors and barely touches
# the common classes, which are undersampled either way.