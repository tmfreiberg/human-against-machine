# Baseline: default ResNet-18 fine-tuning, seven-way task, no balancing.
name: Baseline defaults
description: >
  ResNet-18 with ImageNet weights, one image per lesion, no class balancing and
  no augmentation beyond the resize the network requires. Establishes what the
  pipeline does before any of the deliberate choices are applied.

classes: [mel, nv, bkl, bcc, akiec, vasc, df]

split:
  train_val_ratio: 3
  seed: 0
  keep_first: false
  stratified: true

architecture: resnet18
freeze_strategy: all
pretrained: true

training:
  epochs: 10
  batch_size: 32
  learning_rate: 0.0001

train_one_image_per_lesion: true

transform:
  - name: Resize
    size: [224, 224]
  - name: ToTensor
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]